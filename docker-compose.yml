# Local stack: Postgres + migrations + webhook API + control panel/Telegram bot (`sdr-loop start`).
#   docker compose up -d --build        # then open http://localhost:8501
#   docker compose run --rm cli run --fixture --fake-llm # one-off CLI run, no keys
name: sdrloop

x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &env
    DATABASE_URL: postgresql+asyncpg://sdr:sdr@postgres:5432/sdr
    OUTBOX_PATH: /data/outbox.jsonl
  volumes:
    - ./data:/data
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  # Demo inbox: approved emails land here instead of reaching anyone (http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdr
      POSTGRES_PASSWORD: sdr
      POSTGRES_DB: sdr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"   # localhost only: for dev tools and the Postgres test run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr -d sdr"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    command: []
    restart: "no"

  api:
    <<: *app
    command: ["api", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  app:
    <<: *app
    # Control panel + Telegram bot + nightly learning. Put TELEGRAM_CHAT_ID in .env for Docker:
    # a chat id discovered inside the container is not written back to your .env.
    command: ["start", "--host", "0.0.0.0", "--no-browser", "--no-api"]
    environment:
      <<: *env
      STATE_DIR: /data/state
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAILPIT_URL: http://mailpit:8025
      MAILPIT_UI_URL: http://localhost:${MAILPIT_UI_PORT:-8025}
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    restart: unless-stopped

  cli:
    <<: *app
    profiles: ["cli"]

volumes:
  pgdata:
