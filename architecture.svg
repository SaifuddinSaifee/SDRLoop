<text class="kt" x="24" y="164">APPLICATION  ·  src/sdr_loop  ·  plain Python, typed (mypy strict)</text>
<rect class="shape" x="20" y="176" width="560" height="112" rx="9"/>
<text class="t" x="34" y="200">pipeline.py · orchestrator</text>
<text class="s" x="34" y="218">asyncio, 5 leads at once · one trace per lead · resume by stage</text>
<text class="s" x="34" y="233">per-lead / per-run budget stops · one bad lead never kills the run</text>
