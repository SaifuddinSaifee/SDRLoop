<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 934" width="1180" height="934" role="img" aria-labelledby="t d">
<title id="t">evaboot-sdr-loop architecture</title>
<desc id="d">Layered architecture. Entry points (CLI, FastAPI webhook, Telegram bot, Streamlit) call the application layer: a pipeline orchestrator with seven steps, a read-only research toolset, and the learning loop. Everything that touches a model goes through one LLM gateway that routes to Anthropic and Together AI. Telemetry goes to Langfuse, state to PostgreSQL, approved drafts to a dry-run outbox file. A stack strip lists the libraries and tooling.</desc>
<style>
svg{--bg:#FFFFFF;--ink:#15202B;--muted:#5A6878;--line:#B3BDC8;--node:#F6F8FA;--band:#FBFCFD;
--edit:#2754D3;--reject:#C2491B;--learn:#7446C2;--ok:#1C7C52}
@media (prefers-color-scheme: dark){svg{--bg:#151D26;--ink:#E3E9F0;--muted:#8E9CAC;--line:#3A4858;--node:#1B2530;--band:#18222C;
--edit:#7097FF;--reject:#F08A55;--learn:#B08CF0;--ok:#4CC08A}}
.bg{fill:var(--bg)}
.band{fill:var(--band);stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.edge{fill:none;stroke:var(--line);stroke-width:1.6}
.shape{fill:var(--node);stroke:var(--line);stroke-width:1.4}
.ext{fill:var(--node);stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 3}
.gw{fill:color-mix(in srgb,var(--edit) 13%,var(--node));stroke:var(--edit);stroke-width:2.2}
.sec{fill:color-mix(in srgb,var(--reject) 11%,var(--node));stroke:var(--reject);stroke-width:1.8}
.lrn{fill:color-mix(in srgb,var(--learn) 12%,var(--node));stroke:var(--learn);stroke-width:1.8}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.1}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:15px;font-weight:600;fill:var(--ink)}
.num,.s,.lb,.kt,.cs{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.num{font-size:11px;fill:var(--muted)}
.s{font-size:11px;fill:var(--muted)}
.cs{font-size:11px;fill:var(--ink)}
.lb{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--band);stroke-width:5px;stroke-linejoin:round}
