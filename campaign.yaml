# Campaign brief: edit on the control panel's Setup page.
# Claims below are taken from evaboot.com and evaboot.com/pricing (read 2026-11-08).
company: Evaboot
website: https://evaboot.com
one_liner: >-
  Evaboot exports lead lists from LinkedIn Sales Navigator to a clean CSV and finds and verifies
  each lead's professional email, in one click.
audience: >-
  Sales, outbound and lead-generation teams that prospect in LinkedIn Sales Navigator (they need
  their own Sales Navigator seat).
pain: >-
  Building an email list from Sales Navigator by hand takes hours: copying profiles one by one,
  cleaning names, and checking emails, and Sales Navigator results include leads that don't
  actually match the search filters.
value: Build email lists in seconds, not hours. Pay per lead, not per seat.
allowed_claims:
  - Exports lead lists and searches from LinkedIn Sales Navigator to a clean CSV file
  - Cleans first names, last names, job titles and company names (emojis, credentials, legal suffixes) for outreach
  - Checks whether leads truly match your Sales Navigator filters and removes false positives
  - Finds professional emails and verifies each one exists before you send
  - Pushes new leads to HubSpot, Pipedrive, Attio, lemlist or Instantly
  - Can schedule a Sales Navigator search daily, weekly or monthly so new leads arrive automatically
  - Has an API, an MCP server, and Zapier, Make and n8n actions
  - Unlimited seats, priced per lead (plans start at $9/month for 100 credits)
  - Used by 200,000+ users, rated 4.6/5
forbidden_claims:
  - a free trial or free credits (not stated on the site)
  - phone numbers (Evaboot does not find them)
  - that a LinkedIn account can never be flagged
  - naming any company as a customer
  - accuracy or bounce-rate percentages
goal: Book a short demo call with people who build lead lists in Sales Navigator.
ask: A 15-minute call this week, or a yes/no reply.
tone: Plain, peer-to-peer, specific. No hype, no flattery.
sender:
  name: Saif
  title: Growth, Evaboot
  email: saif@evaboot.test
search_urls: []
