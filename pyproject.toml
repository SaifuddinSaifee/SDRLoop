[project]
name = "sdr-loop"
version = "0.1.0"
description = "Self-improving SDR agent on top of the Evaboot API"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "tenacity>=8.3",
  "anthropic>=0.40",
  "langfuse>=3.0",
  "python-telegram-bot[job-queue]>=21.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "selectolax>=0.3.21",
  "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml",
]

[project.scripts]
sdr-loop = "sdr_loop.cli:app"

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdr_loop"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langfuse.*", "selectolax.*", "rapidfuzz.*", "telegram.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "evals"]
markers = ["eval: runs against real models; needs API keys"]
addopts = "-m 'not eval'"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
